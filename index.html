<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard · LED 13 · MQTT</title>
    <!-- Tailwind via CDN (para estilização rápida e minimalista) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte premium: Inter (clean & moderna) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- MQTT.js para comunicação com broker -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Ajustes finos e transições suaves */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Efeito de vidro mais refinado (compatível com backdrop) */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 40px -15px rgba(0, 40, 80, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }
        /* Botão de toggle com sombra suave */
        .toggle-btn {
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }
        .toggle-btn:active {
            transform: scale(0.96);
        }
        /* Indicador LED animado */
        .led-indicator {
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .led-on {
            background: #fbbf24;
            box-shadow: 0 0 20px 5px rgba(251, 191, 36, 0.8), 0 0 8px 0px #f59e0b inset;
            border-color: #f59e0b;
        }
        .led-off {
            background: #d1d5db;
            box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent inset;
            border-color: #9ca3af;
        }
        /* Fundo gradiente suave e relaxante */
        .bg-dashboard {
            background: linear-gradient(145deg, #d4eaff 0%, #ecf5ff 40%, #ffffff 100%);
        }
        /* Efeito de foco acessível */
        .focus-ring:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 4px;
        }
    </style>
</head>
<body class="min-h-screen bg-dashboard flex items-center justify-center p-4 sm:p-6 md:p-8 antialiased text-slate-700">

    <!-- Card Principal - Glassmorphism -->
    <main class="w-full max-w-lg glass-card rounded-2xl p-6 sm:p-8 transition-all duration-300 hover:shadow-2xl">
        
        <!-- Cabeçalho minimalista -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-slate-800 flex items-center gap-2">
                    <span class="text-blue-500 text-3xl leading-none">⚡</span> LED<span class="text-blue-400 font-light text-xl sm:text-2xl">.13</span>
                </h1>
                <p class="text-sm text-slate-500 mt-0.5 font-light tracking-wide">Controle via MQTT · Arduino</p>
            </div>
            <!-- Status de conexão (sutil) -->
            <div class="flex items-center gap-2 bg-white/60 px-3 py-1.5 rounded-full border border-white/80 shadow-sm">
                <span id="connectionDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="connectionText" class="text-xs font-medium text-slate-600 uppercase tracking-wider">Conectando</span>
            </div>
        </div>

        <!-- Área central do LED (indicador visual) -->
        <div class="flex flex-col items-center justify-center my-6">
            <div class="relative">
                <!-- Círculo externo decorativo -->
                <div class="w-36 h-36 sm:w-40 sm:h-40 rounded-full bg-white/40 backdrop-blur-sm border border-white/80 shadow-inner flex items-center justify-center">
                    <!-- LED interno (indicador de estado) -->
                    <div id="ledIndicator" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full led-off led-indicator border-2 border-gray-300/80 transition-all duration-300"></div>
                </div>
                <!-- Rótulo do estado atual -->
                <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-sm px-4 py-1 rounded-full shadow-md border border-white/80 text-sm font-medium">
                    <span id="ledStateLabel" class="text-slate-600">LED DESLIGADO</span>
                </div>
            </div>
        </div>

        <!-- Botão de controle principal - Toggle elegante -->
        <div class="mt-10 flex flex-col items-center">
            <button id="toggleButton" 
                    class="toggle-btn relative w-full max-w-xs bg-white/80 backdrop-blur-sm border border-white/90 rounded-xl py-4 px-6 shadow-md hover:shadow-lg focus-ring transition-all duration-300 flex items-center justify-center gap-4 group">
                <!-- Ícone dinâmico (circulo + raio) -->
                <span class="relative flex h-6 w-6 items-center justify-center">
                    <span id="btnIcon" class="text-2xl transition-transform duration-300 group-hover:scale-110">⏻</span>
                </span>
                <span id="btnText" class="text-lg font-medium tracking-wide text-slate-700">Ligar LED</span>
                <!-- Efeito de brilho sutil no hover -->
                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-blue-200/0 via-blue-100/20 to-blue-200/0 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            </button>
            
            <!-- Feedback MQTT / Broker info (discreto) -->
            <p class="text-xs text-slate-400 mt-5 font-light flex items-center gap-1.5 bg-white/30 px-3 py-1 rounded-full">
                <span class="w-1 h-1 rounded-full bg-slate-400"></span>
                <span id="brokerInfo">broker.emqx.io:8083</span>
                <span class="w-px h-3 bg-slate-300 mx-1"></span>
                <span id="topicInfo">topico/led13</span>
            </p>
        </div>

        <!-- Divisor sutil e credenciais (opcional, apenas estético) -->
        <div class="mt-8 pt-5 border-t border-white/50 flex justify-between text-[11px] text-slate-400 tracking-wide">
            <span class="font-medium">Dashboard IoT premium</span>
            <span>Arduino · Porta 13</span>
        </div>
    </main>

    <!-- Script de lógica MQTT e UI -->
    <script>
        (function() {
            // ========== CONFIGURAÇÕES ==========
            const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt'; // Broker público seguro (WSS)
            const TOPIC_LED_CONTROL = 'topico/led13';           // Tópico para enviar comandos ao Arduino
            const TOPIC_LED_STATE = 'topico/led13/state';       // Tópico para receber estado (opcional, simularemos)

            // ========== ELEMENTOS DA UI ==========
            const ledIndicator = document.getElementById('ledIndicator');
            const ledStateLabel = document.getElementById('ledStateLabel');
            const toggleButton = document.getElementById('toggleButton');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const connectionDot = document.getElementById('connectionDot');
            const connectionText = document.getElementById('connectionText');
            const brokerInfo = document.getElementById('brokerInfo');
            const topicInfo = document.getElementById('topicInfo');

            // ========== ESTADO ==========
            let ledOn = false;               // estado atual do LED (false = desligado)
            let mqttClient = null;           // instância do cliente MQTT
            let isConnected = false;         // status da conexão

            // ========== FUNÇÕES DE UI ==========
            function updateUI() {
                // Atualiza indicador visual
                if (ledOn) {
                    ledIndicator.classList.remove('led-off');
                    ledIndicator.classList.add('led-on');
                    ledStateLabel.textContent = 'LED LIGADO';
                    ledStateLabel.classList.add('text-amber-600', 'font-semibold');
                    ledStateLabel.classList.remove('text-slate-600');
                    btnText.textContent = 'Desligar LED';
                    btnIcon.textContent = '⏻';
                } else {
                    ledIndicator.classList.remove('led-on');
                    ledIndicator.classList.add('led-off');
                    ledStateLabel.textContent = 'LED DESLIGADO';
                    ledStateLabel.classList.remove('text-amber-600', 'font-semibold');
                    ledStateLabel.classList.add('text-slate-600');
                    btnText.textContent = 'Ligar LED';
                    btnIcon.textContent = '⏻';
                }

                // Ajusta aparência do botão (sutil)
                if (ledOn) {
                    toggleButton.classList.add('bg-white/90', 'border-amber-200/70');
                    toggleButton.classList.remove('border-white/90');
                } else {
                    toggleButton.classList.remove('bg-white/90', 'border-amber-200/70');
                    toggleButton.classList.add('border-white/90');
                }
            }

            // Atualiza status de conexão
            function setConnectionStatus(connected) {
                isConnected = connected;
                if (connected) {
                    connectionDot.classList.remove('bg-amber-400', 'animate-pulse');
                    connectionDot.classList.add('bg-emerald-500');
                    connectionText.textContent = 'Online';
                    connectionText.classList.remove('text-slate-600');
                    connectionText.classList.add('text-emerald-700');
                } else {
                    connectionDot.classList.remove('bg-emerald-500');
                    connectionDot.classList.add('bg-amber-400', 'animate-pulse');
                    connectionText.textContent = 'Offline';
                    connectionText.classList.remove('text-emerald-700');
                    connectionText.classList.add('text-slate-600');
                }
            }

            // ========== COMUNICAÇÃO MQTT ==========
            function publishLedCommand(state) {
                if (!mqttClient || !isConnected) {
                    console.warn('MQTT não conectado. Comando não enviado.');
                    // Mesmo assim atualiza UI localmente (modo demonstração)
                    ledOn = state;
                    updateUI();
                    return;
                }
                // Publica "1" para ligar, "0" para desligar
                const payload = state ? '1' : '0';
                mqttClient.publish(TOPIC_LED_CONTROL, payload, { qos: 0, retain: false });
                console.log(`📤 Comando enviado: ${TOPIC_LED_CONTROL} -> ${payload}`);
                
                // Atualiza UI imediatamente (feedback otimista)
                ledOn = state;
                updateUI();
            }

            // Inicializa cliente MQTT
            function initMQTT() {
                try {
                    mqttClient = mqtt.connect(MQTT_BROKER, {
                        clientId: 'dashboard_led13_' + Math.random().toString(16).substring(2, 10),
                        clean: true,
                        connectTimeout: 5000,
                        reconnectPeriod: 3000,
                    });

                    mqttClient.on('connect', () => {
                        console.log('✅ Conectado ao broker MQTT');
                        setConnectionStatus(true);
                        // Opcional: assinar tópico de estado real do Arduino (se existir)
                        mqttClient.subscribe(TOPIC_LED_STATE, { qos: 0 });
                    });

                    mqttClient.on('message', (topic, message) => {
                        if (topic === TOPIC_LED_STATE) {
                            const payload = message.toString().trim();
                            console.log(`📩 Estado recebido: ${payload}`);
                            if (payload === '1' || payload.toLowerCase() === 'on') {
                                ledOn = true;
                            } else if (payload === '0' || payload.toLowerCase() === 'off') {
                                ledOn = false;
                            }
                            updateUI();
                        }
                    });

                    mqttClient.on('error', (err) => {
                        console.error('MQTT erro:', err);
                        setConnectionStatus(false);
                    });

                    mqttClient.on('close', () => {
                        console.log('MQTT desconectado');
                        setConnectionStatus(false);
                    });

                    mqttClient.on('offline', () => {
                        setConnectionStatus(false);
                    });

                    mqttClient.on('reconnect', () => {
                        setConnectionStatus(false);
                    });

                } catch (e) {
                    console.error('Falha ao inicializar MQTT:', e);
                    setConnectionStatus(false);
                }
            }

            // ========== EVENTOS ==========
            toggleButton.addEventListener('click', () => {
                // Inverte o estado e envia comando
                const newState = !ledOn;
                publishLedCommand(newState);
            });

            // Atualiza informações de broker/tópico (apenas estético)
            brokerInfo.textContent = 'broker.emqx.io:8084';
            topicInfo.textContent = TOPIC_LED_CONTROL;

            // ========== INICIALIZAÇÃO ==========
            // Estado inicial: LED desligado
            ledOn = false;
            updateUI();
            setConnectionStatus(false);
            
            // Conecta ao MQTT após pequeno delay para garantir que a UI esteja pronta
            setTimeout(() => {
                initMQTT();
            }, 300);

            // Simula recebimento de estado inicial (opcional, para demo)
            // (apenas para demonstrar o feedback visual; remova se não desejar)
            // Isso não substitui o MQTT real, é só um fallback visual.
            setTimeout(() => {
                if (!isConnected) {
                    // Se não conectou, ainda podemos interagir localmente
                    console.log('Modo demonstração: interação local ativa');
                }
            }, 2000);
        })();
    </script>
</body>
</html>
